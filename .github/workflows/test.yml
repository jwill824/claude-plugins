name: test
on:
  push:
  pull_request:
jobs:
  disk-reclaim:
    # The machine-wide scanner and executor are macOS-only; the suites use a fake home folder
    # and fake docker, colima and xcrun programs, so nothing on the runner is touched.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run the disk-reclaim suites
        run: |
          set -e
          for t in plugins/disk-reclaim/tests/test_*.py; do
            echo "== $t"
            python3 -B "$t"
          done

  disk-reclaim-linux:
    # Directory mode and --status claim to work on Linux, so run the suites that do not need macOS,
    # and check that the macOS-only tools refuse politely instead of failing in odd ways.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run the portable disk-reclaim suites
        run: |
          set -e
          for t in test_directory test_status test_decisions; do
            echo "== $t"
            python3 -B "plugins/disk-reclaim/tests/$t.py"
          done

  dotfiles:
    # The audit reads package managers and the home folder; the suite replaces the managers with fake
    # programs that log what they are asked, so nothing on the runner is touched.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run the dotfiles suite
        run: |
          set -e
          for t in plugins/dotfiles/tests/test_*.py; do
            echo "== $t"
            python3 -B "$t"
          done
